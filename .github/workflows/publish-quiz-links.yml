name: Publish Telegram quiz links

on:
  push:
    branches:
      - main
    paths:
      - 'quizzes/*/*.md'
      - '.github/workflows/publish-quiz-links.yml'
      - 'scripts/quiz.js'
      - 'scripts/publish-quiz-links.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-quiz-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run validate:quizzes
      - run: npm test

      - name: Configure publication commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish quiz links
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUIZ_SITE_BASE_URL: https://zizitop13.github.io/mock-interview-club-public
        run: npm run publish:quiz-links
