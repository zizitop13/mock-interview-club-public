name: Test runnable quiz projects

on:
  push:
    branches:
      - main
    paths:
      - 'quiz-projects/**'
      - 'scripts/quiz-project-runner.js'
      - '.github/workflows/test-quiz-projects.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'quiz-projects/**'
      - 'scripts/quiz-project-runner.js'
      - '.github/workflows/test-quiz-projects.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Test all runnable quiz projects
        run: mvn --batch-mode --no-transfer-progress --file quiz-projects/pom.xml test
