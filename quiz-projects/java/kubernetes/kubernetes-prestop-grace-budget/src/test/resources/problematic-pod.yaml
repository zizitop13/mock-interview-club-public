apiVersion: v1
kind: Pod
metadata:
  name: checkout-problematic
spec:
  terminationGracePeriodSeconds: 30
  containers:
    - name: checkout
      image: checkout:example
      env:
        - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
          value: 25s
      lifecycle:
        preStop:
          exec:
            command: ["sh", "-c", "sleep 15"]
